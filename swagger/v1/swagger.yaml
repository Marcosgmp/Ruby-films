---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/auth/login":
    post:
      summary: Login do usuário
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: login successful
        '401':
          description: invalid credentials
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
  "/api/v1/auth/register":
    post:
      summary: Registro de novo usuário
      tags:
      - Authentication
      parameters: []
      responses:
        '201':
          description: user created
        '422':
          description: invalid request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                password_confirmation:
                  type: string
              required:
              - name
              - email
              - password
  "/api/v1/auth/logout":
    delete:
      summary: Logout do usuário
      tags:
      - Authentication
      responses:
        '200':
          description: logout successful
  "/api/v1/categories":
    get:
      summary: Lista todas as categorias
      tags:
      - Categories
      responses:
        '200':
          description: categories found
    post:
      summary: Cria uma nova categoria
      tags:
      - Categories
      parameters: []
      responses:
        '201':
          description: category created
        '422':
          description: invalid request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
              - name
  "/api/v1/categories/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Mostra uma categoria específica
      tags:
      - Categories
      responses:
        '200':
          description: category found
        '404':
          description: category not found
    put:
      summary: Atualiza uma categoria
      tags:
      - Categories
      parameters: []
      responses:
        '200':
          description: category updated
        '404':
          description: category not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
    delete:
      summary: Exclui uma categoria
      tags:
      - Categories
      responses:
        '204':
          description: category deleted
        '404':
          description: category not found
  "/api/v1/movies/{movie_id}/comments":
    parameters:
    - name: movie_id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Lista todos os comentários de um filme
      tags:
      - Comments
      responses:
        '200':
          description: comments found
        '404':
          description: movie not found
    post:
      summary: Cria um novo comentário
      tags:
      - Comments
      parameters: []
      responses:
        '201':
          description: comment created
        '422':
          description: invalid request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                user_id:
                  type: integer
              required:
              - content
              - user_id
  "/api/v1/movies/{movie_id}/comments/{id}":
    parameters:
    - name: movie_id
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
    put:
      summary: Atualiza um comentário
      tags:
      - Comments
      parameters: []
      responses:
        '200':
          description: comment updated
        '404':
          description: comment not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
    delete:
      summary: Exclui um comentário
      tags:
      - Comments
      responses:
        '204':
          description: comment deleted
        '404':
          description: comment not found
  "/api/v1/movies":
    get:
      summary: Lista todos os filmes
      tags:
      - Movies
      responses:
        '200':
          description: movies found
    post:
      summary: Cria um novo filme
      tags:
      - Movies
      parameters: []
      responses:
        '201':
          description: movie created
        '422':
          description: invalid request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                synopsis:
                  type: string
                release_year:
                  type: integer
                duration:
                  type: integer
                director:
                  type: string
                user_id:
                  type: integer
                rating:
                  type: number
              required:
              - title
              - user_id
  "/api/v1/movies/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Mostra um filme específico
      tags:
      - Movies
      responses:
        '200':
          description: movie found
        '404':
          description: movie not found
    put:
      summary: Atualiza um filme
      tags:
      - Movies
      parameters: []
      responses:
        '200':
          description: movie updated
        '404':
          description: movie not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                synopsis:
                  type: string
                release_year:
                  type: integer
                duration:
                  type: integer
                director:
                  type: string
                rating:
                  type: number
    delete:
      summary: Exclui um filme
      tags:
      - Movies
      responses:
        '204':
          description: movie deleted
        '404':
          description: movie not found
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: www.example.com
